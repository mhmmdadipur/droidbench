name: Release (macOS)

# Builds the macOS bundle (.dmg + updater .app.tar.gz + .sig) on a macOS runner
# and attaches it to the SAME GitHub Release as the Windows/Linux workflow, so
# one tag produces one cross-platform release.
#
# MANUAL ONLY. The project's release flow builds macOS locally with
# scripts/release-mac.sh and uploads it to the release. This workflow used to run
# on every version tag as well, which meant two different macOS builds raced to
# upload same-named files to the same release and latest.json could end up with a
# signature that no longer matches the uploaded .app.tar.gz (breaking auto-update).
# Run it from the Actions tab only if you want a CI-built macOS bundle INSTEAD of
# the local one (and then do not run scripts/release-mac.sh for that tag).

on:
  workflow_dispatch: {}

permissions:
  contents: write # needed to create/update the release

jobs:
  build-mac:
    # Apple Silicon runner (arm64). Use macos-13 for an Intel/x86_64 build.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install NASM (for OpenH264)
        run: brew install nasm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install

      - name: Bundle CLI binaries (adb/fastboot/scrcpy)
        run: bash scripts/fetch-binaries.sh mac

      - name: Bundle iOS tools (libimobiledevice + dylibs)
        run: |
          brew install libimobiledevice
          bash scripts/bundle-imobiledevice-mac.sh

      - name: Build + attach to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — same repository secrets as the Windows/Linux flow.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Reuse the tag's release so mac lands with windows + linux.
          tagName: ${{ github.ref_name }}
          releaseName: "Droidbench ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          # aarch64 (Apple Silicon). Add x86_64 by also building on macos-13.
          args: "--target aarch64-apple-darwin"
